# Phase B ns-3 simulation config.
#
# Reuses Phase A's Starlink-550 state directory: only `fstate_0.txt` is
# fully intact + augmented for SAT-894 (the dst of our schedule). To
# avoid touching the truncated fstate files at later timesteps, the
# dynamic-state interval is set to 5 s so ns-3 reads fstate_0 once at
# t=0 and the next scheduled read at t=5 s lands past simulation_end.

simulation_end_time_ns=5000000000
simulation_seed=987654321

satellite_network_dir="../../../../paper/satellite_networks_state/gen_data/starlink_550_isls_plus_grid_ground_stations_top_100_algorithm_free_one_only_over_isls"
satellite_network_routes_dir="../../../../paper/satellite_networks_state/gen_data/starlink_550_isls_plus_grid_ground_stations_top_100_algorithm_free_one_only_over_isls/dynamic_state_100ms_for_10s"
dynamic_state_update_interval_ns=5000000000

isl_data_rate_megabit_per_s=10.0
gsl_data_rate_megabit_per_s=10.0
isl_max_queue_size_pkts=100
gsl_max_queue_size_pkts=100

enable_isl_utilization_tracking=false

# TCP defaults still need to be set even though Phase B uses UDP only --
# main_satnet reads tcp_socket_type unconditionally.
tcp_socket_type=TcpNewReno

# Phase B activation flags.
enable_llm_workload=true
llm_workload_schedule_filename="llm_workload_schedule.csv"
llm_workload_log_filename="llm_workload_sink.csv"

# Keep the legacy schedulers off -- we don't want their config files.
enable_tcp_flow_scheduler=false
enable_udp_burst_scheduler=false
enable_pingmesh_scheduler=false
