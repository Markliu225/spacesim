# Phase B LLM workload — multi-flow scenario config.
#
# Reuses Phase A's mixed_topology constellation state. Because that
# state was generated cleanly (every fstate file is intact, unlike the
# half-failed Starlink-550 run), we use a real 100 ms dynamic-state
# update interval — ns-3 actually reads 50 fstate files during the run
# and observes any GSL handovers that happen in the 5 s window.

simulation_end_time_ns=5000000000
simulation_seed=246810

satellite_network_dir="../gen_data/tiny_walker_1500_isls_plus_grid_5cities_algorithm_free_one_only_over_isls"
satellite_network_routes_dir="../gen_data/tiny_walker_1500_isls_plus_grid_5cities_algorithm_free_one_only_over_isls/dynamic_state_100ms_for_5s"
dynamic_state_update_interval_ns=100000000

isl_data_rate_megabit_per_s=10.0
gsl_data_rate_megabit_per_s=10.0
isl_max_queue_size_pkts=100
gsl_max_queue_size_pkts=100

enable_isl_utilization_tracking=false

# TCP socket type is consulted unconditionally by main_satnet; LLM
# workload uses UDP so this only affects behaviour if other schedulers
# get enabled.
tcp_socket_type=TcpNewReno

# Activate Phase B.
enable_llm_workload=true
llm_workload_schedule_filename="llm_workload_schedule.csv"
llm_workload_log_filename="llm_workload_sink.csv"

# Disable everything else.
enable_tcp_flow_scheduler=false
enable_udp_burst_scheduler=false
enable_pingmesh_scheduler=false
