# Phase C full lifecycle — multi-flow scenario config.
#
# Reuses the constellation state built by Phase A's mixed_topology scenario
# (60 sats × 5 GS, 50 fstate timesteps @ 100 ms). Phase A already ran
# augment_fstate.py for ALL 6 compute SATs, so dst routes are present for
# every compute SAT this schedule references. The reverse path (compute
# SAT → GS) uses satgenpy's native GS-dst routes — no augment needed.

simulation_end_time_ns=4900000000
simulation_seed=42424242

satellite_network_dir="../gen_data/tiny_walker_1500_isls_plus_grid_5cities_algorithm_free_one_only_over_isls"
satellite_network_routes_dir="../gen_data/tiny_walker_1500_isls_plus_grid_5cities_algorithm_free_one_only_over_isls/dynamic_state_100ms_for_5s"
dynamic_state_update_interval_ns=100000000

isl_data_rate_megabit_per_s=10.0
gsl_data_rate_megabit_per_s=10.0
isl_max_queue_size_pkts=100
gsl_max_queue_size_pkts=100

enable_isl_utilization_tracking=false
tcp_socket_type=TcpNewReno

# Phase C activation
enable_llm_workload=true
enable_llm_response_loop=true
llm_workload_schedule_filename="llm_workload_schedule.csv"
llm_workload_log_filename="llm.csv"

# Compute model parameters.
compute_alpha_ns_per_input_token=80000
compute_beta_ns_per_output_token=40000
compute_gamma_ns=8000000
gather_timeout_ns=10000000000

# Disable other schedulers
enable_tcp_flow_scheduler=false
enable_udp_burst_scheduler=false
enable_pingmesh_scheduler=false
