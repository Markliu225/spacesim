# Phase A mixed-topology smoke test config.
#
# - 60-sat constellation, 5 ground stations, 6 compute sats.
# - 5-second simulation, 100 ms forwarding-state update interval (matches
#   state-gen output, so ns-3 sees real handover events during the run).
# - 5 concurrent TCP flows covering GS->compute, compute->GS, GS->GS.
#
# State-dir paths are resolved relative to the run dir. We point them at
# the gen_data/ tree under this scenario so the run is self-contained.

simulation_end_time_ns=5000000000
simulation_seed=987654321

satellite_network_dir="../gen_data/tiny_walker_1500_isls_plus_grid_5cities_algorithm_free_one_only_over_isls"
satellite_network_routes_dir="../gen_data/tiny_walker_1500_isls_plus_grid_5cities_algorithm_free_one_only_over_isls/dynamic_state_100ms_for_5s"
dynamic_state_update_interval_ns=100000000

# 10 Mbps links, 100-pkt buffers -- same baseline as Phase A's main run
# so results are comparable.
isl_data_rate_megabit_per_s=10.0
gsl_data_rate_megabit_per_s=10.0
isl_max_queue_size_pkts=100
gsl_max_queue_size_pkts=100

enable_isl_utilization_tracking=true
isl_utilization_tracking_interval_ns=500000000

tcp_socket_type=TcpNewReno

enable_tcp_flow_scheduler=true
tcp_flow_schedule_filename="schedule.csv"
# Log RTT + cwnd + progress + rate for all 5 flows
tcp_flow_enable_logging_for_tcp_flow_ids=set(0,1,2,3,4)