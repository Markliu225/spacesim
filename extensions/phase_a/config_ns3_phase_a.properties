# Phase A — ns-3 simulation config for one GS -> compute-SAT TCP flow.
#
# This file is copied/symlinked into the run dir as `config_ns3.properties`.
# Paths are resolved relative to the run dir (`runs/<name>/`) by main_satnet.

simulation_end_time_ns=5000000000
simulation_seed=123456789

# State directory generated by paper/satellite_networks_state/main_starlink_550.py
# with args: 10 100 isls_plus_grid ground_stations_top_100 algorithm_free_one_only_over_isls 2
# The dynamic_state subdir holds fstate_<t>.txt plus our SAT-dst augment rows.
satellite_network_dir="../../../../paper/satellite_networks_state/gen_data/starlink_550_isls_plus_grid_ground_stations_top_100_algorithm_free_one_only_over_isls"
satellite_network_routes_dir="../../../../paper/satellite_networks_state/gen_data/starlink_550_isls_plus_grid_ground_stations_top_100_algorithm_free_one_only_over_isls/dynamic_state_100ms_for_10s"
dynamic_state_update_interval_ns=100000000

# Link parameters: pick a setting where 1 MB completes inside 5 s with margin.
# 10 Mbps with 100-pkt queues is the integration-test baseline; we keep the
# same so the result is comparable to the Manila->Dalian numbers.
isl_data_rate_megabit_per_s=10.0
gsl_data_rate_megabit_per_s=10.0
isl_max_queue_size_pkts=100
gsl_max_queue_size_pkts=100

enable_isl_utilization_tracking=true
isl_utilization_tracking_interval_ns=1000000000

# TCP -- New Reno is the integration-test default; the small RTT and 1 MB
# flow size mean cwnd ramp dominates anyway.
tcp_socket_type=TcpNewReno

enable_tcp_flow_scheduler=true
tcp_flow_schedule_filename="schedule.csv"
tcp_flow_enable_logging_for_tcp_flow_ids=set(0)
